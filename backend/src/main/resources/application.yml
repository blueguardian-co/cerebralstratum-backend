quarkus:
  application:
    name: cerebral-stratum-backend
  devservices:
    enabled: true
  smallrye-openapi:
    path: /openapi
  swagger-ui:
    path: /swagger-ui
    always-include: true
  http:
    port: 6443
  grpc:
    server:
      port: 9000
      enable-reflection-service: true
      use-separate-server: false
  dev-ui:
    cors:
      enabled: false
  live-reload:
    instrumentation: true
  datasource:
    db-kind: postgresql
    devservices:
      db-name: cerebral-stratum
      init-script-path: devservices/init.sql
      port: 5432
      image-name: postgis/postgis:16-3.4
      command: postgres
      container-env:
        "POSTGRES_HOST_AUTH_METHOD": trust
  hibernate-orm:
    database:
      default-schema: ${quarkus.liquibase.default-schema-name}
    mapping:
      format:
        global: ignore
      timezone:
        default-storage: normalize-utc
    schema-management:
      strategy: none
  oidc:
    client-id: device-fleet
    credentials:
      secret: yxj6VJfZB8plW95iLkGn9ebWPPhic6yY
    roles:
        role-claim-path: realm_access/roles
  keycloak:
    devservices:
      enabled: true
      java-opts: -XX:UseSVE=0
      realm-path: devservices/realm.json
      realm-name: ${keycloak.realm}
      # Pinned (like the Postgres/Kafka dev-service ports above) so the frontend's
      # env.js KEYCLOAK_URL doesn't need updating on every backend restart.
      port: 8180
      # Trust X-Forwarded-* from a reverse proxy (e.g. Cloudflare Tunnel) so Keycloak's
      # self-referential URLs (including the UMA2 discovery document AuthzClient reads)
      # advertise https rather than the plain-http scheme it sees on its local listener.
      # No-op when accessed directly (no forwarded headers present).
      container-env:
        KC_PROXY_HEADERS: xforwarded
    admin-client:
      realm: ${keycloak.realm}
    policy-enforcer:
     enabled: false
  scheduler:
    start-mode: normal
  kafka:
    devservices:
      port: 9092
'%prod':
  quarkus:
    otel:
      resource:
        attributes: "service.instance.id=${HOSTNAME:unknown-prod},service.name=cerebral-stratum-backend,service.namespace=cerebral-stratum,deployment.environment.name=production"
      traces:
        enabled: true
        eusp:
          enabled: false
      metrics:
          enabled: true
      logs:
        enabled: true
    liquibase:
      migrate-at-start: true
      change-log: db/changeLog.yaml
      default-schema-name: cerebralstratum
    http:
      host: 0.0.0.0
      cors:
        enabled: true
        origins: /.*/
    datasource:
      jdbc:
        url: ${JDBC_URL:jdbc:postgresql://localhost:5432/cerebral-stratum}?defaultSchema=cerebralstratum
      username: ${JDBC_USERNAME:postgres}
      password: ${JDBC_PASSWORD}
    oidc:
      auth-server-url: ${OIDC_AUTH_SERVER_URL:https://sso.blueguardian.co/realms/external}
      credentials:
        secret: ${OIDC_SECRET}
    keycloak:
      admin-client:
        server-url: https://sso.blueguardian.co
        username: ${keycloak.username}
        password: ${keycloak.password}
        realm: ${keycloak.realm}
        grant-type: CLIENT_CREDENTIALS
        client-id: ${quarkus.oidc.client-id}
        client-secret: ${quarkus.oidc.credentials.secret}
      policy-enforcer:
        paths:
          quarkus-status:
            paths: /q/*
            enforcement-mode: disabled
          swagger-ui:
            paths: /swagger-ui/*
            enforcement-mode: disabled
          openapi:
            paths: /openapi
            enforcement-mode: disabled
        enabled: true
'%dev':
  quarkus:
    otel:
      resource:
        attributes: "service.instance.id=${HOSTNAME:unknown-dev},service.name=cerebral-stratum-backend,deployment.environment.name=development"
      traces:
        enabled: true
        eusp:
          enabled: true
      logs:
        enabled: true
      metrics:
        enabled: true
      exporter:
        otlp:
          endpoint: https://otlp-gateway-prod-au-southeast-1.grafana.net/otlp
          protocol: http/protobuf
          headers: ${QUARKUS_OTEL_EXPORTER_OTLP_HEADERS}
    liquibase:
      migrate-at-start: true
      change-log: devservices/changeLog.yaml
      default-schema-name: cerebralstratum
    http:
      host: 0.0.0.0
      cors:
        enabled: true
        origins: /.*/
    oidc:
      credentials:
        secret: yxj6VJfZB8plW95iLkGn9ebWPPhic6yY
      client-id: device-fleet
      # Keycloak echoes back whatever hostname was used to reach it as the
      # token's `iss` claim (request-based hostname resolution). The backend
      # itself talks to the Keycloak dev-service via localhost, but browsers
      # on other devices/LAN IPs get tokens issued with a different `iss` —
      # relax issuer validation in dev (user-confirmed) rather than pin the
      # backend to one hostname that not every client can actually reach.
      token:
        issuer: any
    keycloak:
      admin-client:
        server-url: ${quarkus.oidc.auth-server-url}
        username: admin
        password: admin
        realm: ${keycloak.realm}
        grant-type: CLIENT_CREDENTIALS
        client-id: ${quarkus.oidc.client-id}
        client-secret: ${quarkus.oidc.credentials.secret}
keycloak:
  realm: external

'%test':
  quarkus:
    otel:
      traces:
        enabled: false
      metrics:
        enabled: false
      logs:
        enabled: false
    liquibase:
      migrate-at-start: true
      change-log: db/changeLog.yaml
      default-schema-name: cerebralstratum