quarkus:
  application:
    name: cerebral-stratum-device-simulator
  devservices:
    enabled: true
  live-reload:
    instrumentation: true
  kafka:
    devservices:
      port: 9092

simulator:
  device-count: 1
  location-interval: 5s
  status-interval: 30s
  canbus-interval: 10s
  origin-lat: -27.4698
  origin-lon: 153.0251

mp:
  messaging:
    outgoing:
      /device/location:
        topic: location
        host: ${MQTT_HOST:localhost}
        port: 1883
        connector: smallrye-mqtt
      /device/status:
        topic: status
        host: ${MQTT_HOST:localhost}
        port: 1883
        connector: smallrye-mqtt
      /device/canbus:
        topic: canbus
        host: ${MQTT_HOST:localhost}
        port: 1883
        connector: smallrye-mqtt
      # Dev-only MQTT->Kafka bridge (stands in for Eclipse Hono until it's wired up).
      kafka-location:
        topic: device.location
        key:
          serializer: org.apache.kafka.common.serialization.UUIDSerializer
        connector: smallrye-kafka
      kafka-status:
        topic: device.status
        key:
          serializer: org.apache.kafka.common.serialization.UUIDSerializer
        connector: smallrye-kafka
      kafka-canbus:
        topic: device.canbus
        key:
          serializer: org.apache.kafka.common.serialization.UUIDSerializer
        connector: smallrye-kafka
    incoming:
      mqtt-location:
        topic: location
        host: ${MQTT_HOST:localhost}
        port: 1883
        auto-generated-client-id: true
        connector: smallrye-mqtt
      mqtt-status:
        topic: status
        host: ${MQTT_HOST:localhost}
        port: 1883
        auto-generated-client-id: true
        connector: smallrye-mqtt
      mqtt-canbus:
        topic: canbus
        host: ${MQTT_HOST:localhost}
        port: 1883
        auto-generated-client-id: true
        connector: smallrye-mqtt

'%dev':
  quarkus:
    otel:
      resource:
        attributes: "service.instance.id=${HOSTNAME:unknown-dev},service.name=cerebral-stratum-device-simulator,deployment.environment.name=development"
      traces:
        enabled: true
        eusp:
          enabled: true
      logs:
        enabled: true
      metrics:
        enabled: true
      exporter:
        otlp:
          endpoint: https://otlp-gateway-prod-au-southeast-1.grafana.net/otlp
          protocol: http/protobuf
          headers: ${QUARKUS_OTEL_EXPORTER_OTLP_HEADERS}

'%test':
  quarkus:
    otel:
      traces:
        enabled: false
      metrics:
        enabled: false
      logs:
        enabled: false

'%prod':
  quarkus:
    otel:
      resource:
        attributes: "service.instance.id=${HOSTNAME:unknown-prod},service.name=cerebral-stratum-device-simulator,service.namespace=cerebral-stratum,deployment.environment.name=production"
      traces:
        enabled: true
        eusp:
          enabled: false
      metrics:
        enabled: true
      logs:
        enabled: true
    http:
      host: 0.0.0.0
